<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Looply"/>
<meta name="theme-color" content="#F7F4EE"/>
<title>Looply</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.svg"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --iv:#F7F4EE;--gr:#8BAF7A;--gr-l:#D8EBC8;--gr-d:#5A8A48;
  --br:#9C7E5A;--br-l:#EDE4D6;--tx:#4A3F35;--tx-s:#7A6A5A;--bd:#D8CFC0;
  --ov1:#F5C84A;--ov2:#E8960A;--ov3:#C8640A;--ov-l:#FDF0D0;
  --radius-md:10px;--radius-lg:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--iv);}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--iv);padding:calc(var(--safe-top) + 1.25rem) 1.25rem calc(var(--safe-bottom) + 5rem);}

.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.hdr h1{font-size:22px;font-weight:600;color:var(--tx);letter-spacing:.02em;}
.hdr-date{font-size:12px;color:var(--tx-s);margin-top:2px;}
.hdr-settings-btn{background:none;border:none;font-size:20px;color:var(--tx-s);cursor:pointer;padding:6px;border-radius:8px;line-height:1;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.hdr-settings-btn:active{background:var(--br-l);}

.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.25rem;}
.stat-card{background:#fff;border:.5px solid var(--bd);border-radius:var(--radius-lg);padding:11px 12px;}
.stat-label{font-size:10px;color:var(--tx-s);margin-bottom:5px;font-weight:500;letter-spacing:.04em;}
.stat-value{font-size:20px;font-weight:600;color:var(--tx);}
.stat-bar{height:4px;background:var(--br-l);border-radius:4px;margin-top:7px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:4px;transition:width .5s;}

.view-tabs{display:flex;gap:0;margin-bottom:1.25rem;border:.5px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff;}
.vtab{flex:1;font-size:14px;padding:9px 0;border:none;background:transparent;color:var(--tx-s);cursor:pointer;font-family:inherit;transition:background .15s,color .15s;position:relative;-webkit-tap-highlight-color:transparent;}
.vtab:not(:last-child)::after{content:'';position:absolute;right:0;top:20%;height:60%;width:.5px;background:var(--bd);}
.vtab.active{background:var(--tx);color:var(--iv);font-weight:600;}
.vtab.active::after{display:none;}
.vtab:first-child{border-radius:13px 0 0 13px;}
.vtab:last-child{border-radius:0 13px 13px 0;}

.view-section{display:none;}
.view-section.show{display:block;}
.todo-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem;}
.empty-msg{font-size:13px;color:var(--tx-s);margin-bottom:1.5rem;padding:2rem 1rem;text-align:center;background:#fff;border-radius:var(--radius-lg);border:.5px solid var(--bd);}

.todo-card{background:#fff;border:.5px solid var(--bd);border-radius:var(--radius-lg);padding:14px;transition:background .3s,border-color .3s;}
.todo-card.done-today{background:#F0EDE8;border-color:#C8BFB0;}
.todo-card.lv1{background:#FFFBF0;border-color:var(--ov1);}
.todo-card.lv2{background:var(--ov-l);border-color:var(--ov2);}
.todo-card.lv3{background:#FDE8C0;border-color:var(--ov3);}

.todo-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.todo-name{font-size:16px;color:var(--tx);flex:1;min-width:0;line-height:1.3;}
.todo-card.done-today .todo-name{color:var(--tx-s);text-decoration:line-through;}
.done-check{font-size:13px;color:var(--gr);flex-shrink:0;opacity:0;transition:opacity .2s;font-weight:600;}
.todo-card.done-today .done-check{opacity:1;}
.freq-badge{font-size:11px;color:var(--tx-s);background:var(--br-l);padding:3px 9px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.menu-btn{width:32px;height:32px;border:none;background:transparent;cursor:pointer;color:var(--tx-s);display:flex;align-items:center;justify-content:center;border-radius:8px;flex-shrink:0;font-size:18px;letter-spacing:1px;-webkit-tap-highlight-color:transparent;}
.menu-btn:active{background:var(--br-l);}

.count-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cnt-btns{display:flex;align-items:center;gap:8px;}
.cnt-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--bd);background:transparent;font-size:18px;cursor:pointer;color:var(--tx);display:flex;align-items:center;justify-content:center;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:background .1s;}
.cnt-btn.plus{border-color:var(--gr);color:var(--gr);}
.cnt-btn.minus{color:var(--tx-s);opacity:.4;font-size:16px;}
.cnt-btn:active{background:var(--br-l);}
.cnt-num{font-size:20px;font-weight:600;color:var(--tx);min-width:30px;text-align:center;}
.cnt-target{font-size:13px;color:var(--tx-s);}
.pct-pill{margin-left:auto;font-size:13px;font-weight:600;padding:4px 11px;border-radius:12px;}
.pct-normal{color:var(--gr-d);background:var(--gr-l);}
.pct-lv1{color:#7A5500;background:#FFF0B0;}
.pct-lv2{color:#7A3800;background:#FFD070;}
.pct-lv3{color:white;background:var(--ov3);}

.meter-wrap{position:relative;height:12px;margin-bottom:10px;}
.meter-track{height:8px;background:var(--br-l);border-radius:4px;overflow:hidden;position:absolute;top:2px;left:0;right:0;}
.m-layer-a{position:absolute;top:0;left:0;height:100%;border-radius:4px;transition:width .35s cubic-bezier(.4,0,.2,1);}
.m-layer-b{position:absolute;top:0;left:0;height:100%;border-radius:4px;transition:width .35s cubic-bezier(.4,0,.2,1);}
.meter-marker{position:absolute;top:-1px;width:2px;background:var(--tx-s);height:10px;border-radius:1px;left:calc(100% - 1px);}

.grass-wrap{padding-top:10px;border-top:.5px solid var(--bd);}
.grass-header{margin-bottom:6px;}
.grass-label{font-size:11px;color:var(--tx-s);}
.grass-grid{display:flex;gap:3px;flex-wrap:wrap;}
.gdot{width:14px;height:14px;border-radius:3px;flex-shrink:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s;}
.gdot:active{transform:scale(1.3);}

.add-area{background:#fff;border:.5px dashed var(--bd);border-radius:var(--radius-lg);padding:14px;}
.add-row{display:flex;gap:8px;margin-bottom:10px;}
.add-input{flex:1;border:.5px solid var(--bd);border-radius:var(--radius-md);padding:10px 12px;font-size:15px;color:var(--tx);background:var(--iv);outline:none;font-family:inherit;-webkit-appearance:none;}
.add-input:focus{border-color:var(--gr);}
.add-input::placeholder{color:var(--tx-s);opacity:.7;}
.add-btn{background:var(--gr);color:white;border:none;border-radius:var(--radius-md);padding:10px 16px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:600;-webkit-tap-highlight-color:transparent;}
.add-btn:active{background:var(--gr-d);}
.freq-grid{display:flex;gap:6px;flex-wrap:wrap;}
.fq-btn{font-size:12px;border:.5px solid var(--bd);border-radius:12px;padding:5px 11px;cursor:pointer;color:var(--tx-s);background:transparent;font-family:inherit;-webkit-tap-highlight-color:transparent;}
.fq-btn.sel{background:var(--br-l);border-color:var(--br);color:var(--br);}
.n-field{display:none;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--tx-s);}
.n-field.show{display:flex;}
.ni{width:56px;border:.5px solid var(--bd);border-radius:var(--radius-md);padding:6px 8px;font-size:14px;text-align:center;font-family:inherit;color:var(--tx);background:var(--iv);outline:none;-webkit-appearance:none;}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(74,63,53,.45);z-index:200;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem 1.5rem calc(var(--safe-bottom) + 1.5rem);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 1.2rem;}
.modal h3{font-size:17px;font-weight:600;color:var(--tx);margin-bottom:6px;}
.modal p{font-size:14px;color:var(--tx-s);margin-bottom:.8rem;line-height:1.6;}
.modal-btns{display:flex;gap:8px;margin-top:1rem;}
.modal-btn{flex:1;padding:12px;border-radius:var(--radius-md);font-size:14px;font-family:inherit;cursor:pointer;border:.5px solid var(--bd);font-weight:600;-webkit-tap-highlight-color:transparent;}
.modal-btn.cancel{background:transparent;color:var(--tx-s);}
.modal-btn.confirm{background:var(--gr);color:white;border-color:var(--gr);}
.modal-btn.warn{background:var(--br-l);color:var(--br);border-color:var(--bd);}
.modal-btn.danger{background:#F5E0D8;color:#A03010;border-color:#E0C0B0;}
.modal-btn:active{opacity:.8;}

.field{margin-bottom:1rem;}
.field label{display:block;font-size:12px;color:var(--tx-s);margin-bottom:5px;font-weight:500;}
.field input[type=text],.field input[type=number]{width:100%;border:.5px solid var(--bd);border-radius:var(--radius-md);padding:10px 12px;font-size:15px;color:var(--tx);background:var(--iv);outline:none;font-family:inherit;-webkit-appearance:none;}
.field input:focus{border-color:var(--gr);}

.dot-edit-wrap{display:flex;align-items:center;justify-content:center;gap:16px;padding:1rem 0;}
.dot-edit-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--bd);background:transparent;font-size:22px;cursor:pointer;color:var(--tx);display:flex;align-items:center;justify-content:center;font-family:inherit;}
.dot-edit-btn.plus{border-color:var(--gr);color:var(--gr);}
.dot-edit-btn.minus{color:var(--tx-s);opacity:.5;}
.dot-edit-num{font-size:28px;font-weight:700;color:var(--tx);min-width:48px;text-align:center;}
.dot-preview{width:32px;height:32px;border-radius:6px;margin:0 auto 4px;}
.dot-edit-pct{font-size:13px;color:var(--tx-s);text-align:center;margin-bottom:.5rem;}

.install-banner{display:none;background:var(--gr-l);border:.5px solid var(--gr);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:1.25rem;font-size:13px;color:var(--gr-d);line-height:1.5;}
.install-banner.show{display:block;}
.install-banner strong{font-weight:600;}

.undo-toast{display:none;position:fixed;bottom:calc(var(--safe-bottom) + 5.5rem);left:50%;transform:translateX(-50%);width:calc(100% - 2.5rem);max-width:440px;z-index:150;border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 4px 20px rgba(74,63,53,.25);}
.undo-toast.show{display:block;}
.undo-inner{display:flex;align-items:stretch;}
.undo-btn{flex:1;padding:14px 16px;border:none;background:var(--tx);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;}
.undo-btn:active{opacity:.85;}
.undo-close{width:52px;flex-shrink:0;border:none;border-left:1px solid rgba(255,255,255,.15);background:var(--tx);color:rgba(255,255,255,.6);font-size:16px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;}
.undo-close:active{opacity:.7;}
.undo-bar{height:4px;width:100%;background:var(--gr);}


.summary-section{margin-bottom:1.25rem;}
.summary-section-title{font-size:11px;font-weight:600;color:var(--tx-s);letter-spacing:.06em;margin-bottom:8px;}
.summary-overall{display:flex;align-items:center;gap:12px;background:var(--iv);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px;}
.summary-overall-pct{font-size:32px;font-weight:700;color:var(--tx);}
.summary-overall-bar-wrap{flex:1;}
.summary-overall-label{font-size:12px;color:var(--tx-s);margin-bottom:4px;}
.summary-overall-bar{height:6px;background:var(--br-l);border-radius:4px;overflow:hidden;}
.summary-overall-bar-fill{height:100%;border-radius:4px;background:var(--gr);}
.summary-task-list{display:flex;flex-direction:column;gap:6px;}
.summary-task-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.summary-task-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;font-weight:700;}
.icon-done{background:var(--gr-l);color:var(--gr-d);}
.icon-miss{background:#F5E0D8;color:#A03010;}
.summary-task-name{flex:1;color:var(--tx);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.summary-task-pct{font-size:12px;color:var(--tx-s);flex-shrink:0;}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div>
      <h1>Looply - TODO List -</h1>
      <div class="hdr-date" id="hdr-date"></div>
    </div>
    <button class="hdr-settings-btn" onclick="openSettings()">⚙</button>
  </div>
  <div class="install-banner" id="install-banner">
    📲 <strong>ホーム画面に追加</strong>すると、アプリとして使えます。<br>
    Safari の共有ボタン →「ホーム画面に追加」
  </div>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">DAILY</div>
      <div class="stat-value" id="daily-pct">—</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="daily-bar" style="width:0%;background:var(--gr)"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">WEEKLY</div>
      <div class="stat-value" id="weekly-pct">—</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="weekly-bar" style="width:0%;background:var(--gr)"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">MONTHLY</div>
      <div class="stat-value" id="monthly-pct">—</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="monthly-bar" style="width:0%;background:var(--gr)"></div></div>
    </div>
  </div>
  <div class="view-tabs" id="view-tabs"></div>
  <div id="sections-wrap"></div>
  <div class="add-area">
    <div class="add-row">
      <input class="add-input" id="new-name" placeholder="新しい習慣を追加..."/>
      <button class="add-btn" onclick="addTodo()">追加</button>
    </div>
    <div class="freq-grid" id="add-fq">
      <button class="fq-btn sel" data-freq="everyday-n" onclick="selAddFreq(this)">毎日N回</button>
      <button class="fq-btn"     data-freq="week"       onclick="selAddFreq(this)">週N回</button>
      <button class="fq-btn"     data-freq="month"      onclick="selAddFreq(this)">月N回</button>
    </div>
    <div class="n-field show" id="add-nf">
      <span>回数：</span>
      <input class="ni" id="add-nv" type="number" min="1" max="99" value="3"/>
      <span id="add-nu">回/日</span>
    </div>
  </div>
</div>

<div class="undo-toast" id="undo-toast">
  <div class="undo-inner">
    <button class="undo-btn" id="undo-btn"></button>
    <button class="undo-close" id="undo-close">✕</button>
  </div>
  <div class="undo-bar" id="undo-bar"></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="bgClose(event)">
  <div class="modal" id="modal-box">
    <div class="modal-handle"></div>
    <h3 id="m-title"></h3>
    <p id="m-body"></p>
    <div id="m-content"></div>
    <div class="modal-btns" id="m-btns"></div>
  </div>
</div>

<script>
// ── Storage ──
const SK = 'looply_v2';
const SK_META = 'looply_meta_v2';
let todos = [];
let addFreq = 'everyday-n';
let curView = 'day';
let undoState = null;
let resetHr = 0;
const UNDO_MS = 4000;

const VIEWS = [
  { key: 'day',   label: '日', freqTypes: ['every', 'everyday-n'] },
  { key: 'week',  label: '週', freqTypes: ['week'] },
  { key: 'month', label: '月', freqTypes: ['month'] },
];

// ── Grass config ──
const DOT_SZ = 14;
function spanFor(ft) { return ft === 'month' ? 6 : ft === 'week' ? 12 : 14; }
function grassLabel(ft) { return ft === 'month' ? '過去6ヶ月' : ft === 'week' ? '過去12週間' : '過去14日間'; }
function dotColor(v) { return ['#E8E2D8', '#B8D9A8', '#8BAF7A', '#2A6020'][v] || '#E8E2D8'; }

// ── Date utils ──
const DAY_JP = ['日', '月', '火', '水', '木', '金', '土'];
function effectiveNow() { return new Date(Date.now() - resetHr * 3600000); }
function todayKey() {
  const d = effectiveNow();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function weekKey() {
  const d = effectiveNow();
  const dow = d.getDay() === 0 ? 7 : d.getDay();
  const mon = new Date(d); mon.setDate(d.getDate() - (dow - 1));
  const jan4 = new Date(mon.getFullYear(), 0, 4);
  const sw1 = new Date(jan4); sw1.setDate(jan4.getDate() - (jan4.getDay() === 0 ? 6 : jan4.getDay() - 1));
  const wn = Math.round((mon - sw1) / 604800000) + 1;
  return mon.getFullYear() + '-W' + String(wn).padStart(2, '0');
}
function monthKey() {
  const d = effectiveNow();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function dotDateLabel(ago, ft) {
  const eff = effectiveNow();
  if (ft === 'every' || ft === 'everyday-n') {
    const d = new Date(eff); d.setDate(d.getDate() - ago);
    return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + '（' + DAY_JP[d.getDay()] + '）';
  }
  if (ft === 'week') {
    const dow = eff.getDay() === 0 ? 7 : eff.getDay();
    const mon = new Date(eff); mon.setDate(eff.getDate() - (dow - 1)); mon.setHours(0, 0, 0, 0);
    const tmon = new Date(mon); tmon.setDate(mon.getDate() - ago * 7);
    const tsun = new Date(tmon); tsun.setDate(tmon.getDate() + 6);
    return String(tmon.getMonth() + 1).padStart(2, '0') + '/' + String(tmon.getDate()).padStart(2, '0') + '(月)〜' +
           String(tsun.getMonth() + 1).padStart(2, '0') + '/' + String(tsun.getDate()).padStart(2, '0') + '（日）';
  }
  const d = new Date(eff.getFullYear(), eff.getMonth() - ago, 1);
  return (d.getMonth() + 1) + '月';
}

// ── Load / Save ──
function save() {
  try { localStorage.setItem(SK, JSON.stringify(todos)); } catch (e) {}
}
function loadMeta() {
  try { return JSON.parse(localStorage.getItem(SK_META) || '{}'); } catch (e) { return {}; }
}
function saveMeta(m) {
  try { localStorage.setItem(SK_META, JSON.stringify(m)); } catch (e) {}
}

function load() {
  resetHr = loadMeta().resetHour || 0;
  try {
    const raw = localStorage.getItem(SK);
    if (raw) {
      todos = JSON.parse(raw);
      ensureKeys();
      return;
    }
    // Migrate from old format
    const old = localStorage.getItem('teinei_pwa_v1');
    if (old) {
      todos = migrateOld(JSON.parse(old));
      save();
      return;
    }
  } catch (e) {}
  todos = genDefaults();
}

function ensureKeys() {
  const dk = todayKey(), wk = weekKey(), mk = monthKey();
  todos.forEach(t => {
    if (!t.lastDayKey)   t.lastDayKey   = dk;
    if (!t.lastWeekKey)  t.lastWeekKey  = wk;
    if (!t.lastMonthKey) t.lastMonthKey = mk;
    if (!t.history)      t.history      = new Array(spanFor(t.freqType)).fill(0);
    if (t.todayDone  === undefined) t.todayDone  = 0;
    if (t.weekDone   === undefined) t.weekDone   = 0;
    if (t.monthDone  === undefined) t.monthDone  = 0;
  });
}

function migrateOld(oldTodos) {
  const dk = todayKey(), wk = weekKey(), mk = monthKey();
  return oldTodos.map(t => ({
    id:           t.id,
    name:         t.name,
    freqType:     t.freqType,
    freqLabel:    t.freqLabel,
    target:       t.target,
    n:            t.n,
    todayDone:    t.todayDone  || 0,
    weekDone:     t.weekDone   || 0,
    monthDone:    t.monthDone  || 0,
    history:      t.history    || new Array(spanFor(t.freqType)).fill(0),
    lastDayKey:   dk,
    lastWeekKey:  wk,
    lastMonthKey: mk,
  }));
}

function genDefaults() {
  const dk = todayKey(), wk = weekKey(), mk = monthKey();
  function rh(ft) {
    return Array.from({ length: spanFor(ft) }, () => { const r = Math.random(); return r < .15 ? 0 : r < .45 ? 1 : r < .75 ? 2 : 3; });
  }
  return [
    { id: 1, name: '朝の白湯を飲む', freqType: 'every',      freqLabel: '毎日',    target: 1, n: 1, todayDone: 1, weekDone: 6,  monthDone: 18, history: rh('every'),      lastDayKey: dk, lastWeekKey: wk, lastMonthKey: mk },
    { id: 2, name: '腕立て伏せ',     freqType: 'everyday-n', freqLabel: '毎日3回', target: 3, n: 3, todayDone: 2, weekDone: 11, monthDone: 55, history: rh('everyday-n'), lastDayKey: dk, lastWeekKey: wk, lastMonthKey: mk },
    { id: 3, name: 'ジムに行く',     freqType: 'week',        freqLabel: '週2回',   target: 2, n: 2, todayDone: 0, weekDone: 3,  monthDone: 8,  history: rh('week'),       lastDayKey: dk, lastWeekKey: wk, lastMonthKey: mk },
    { id: 4, name: '日記を書く',     freqType: 'month',       freqLabel: '月8回',   target: 8, n: 8, todayDone: 1, weekDone: 10, monthDone: 10, history: rh('month'),      lastDayKey: dk, lastWeekKey: wk, lastMonthKey: mk },
  ];
}

// ── Helpers ──
function pct(done, target) { return target ? Math.round(done / target * 100) : 0; }
function lvClass(p) { return p <= 100 ? '' : p <= 150 ? 'lv1' : p <= 200 ? 'lv2' : 'lv3'; }
function pctPill(p) { return p <= 100 ? 'pct-normal' : p <= 150 ? 'pct-lv1' : p <= 200 ? 'pct-lv2' : 'pct-lv3'; }
function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function histVal(done, target) { const p = pct(done, target); return p < 80 ? 0 : p < 100 ? 1 : p < 120 ? 2 : 3; }

// Returns the display count for a task (correct field per type)
function getCount(t) {
  if (t.freqType === 'every' || t.freqType === 'everyday-n') return t.todayDone;
  if (t.freqType === 'week') return t.weekDone;
  return t.monthDone;
}

// Returns whether the task is "done" for the current period
function isDone(t) {
  if (t.freqType === 'every')      return t.todayDone >= 1;
  if (t.freqType === 'everyday-n') return t.todayDone >= t.target;
  if (t.freqType === 'week')       return t.weekDone  >= t.target;
  return t.monthDone >= t.target;
}

// ── Reset (runs on load and every minute) ──
function checkResets() {
  const dk = todayKey(), wk = weekKey(), mk = monthKey();
  let changed = false;

  // Snapshot daily tasks BEFORE resetting (for summary modal)
  const snap = todos
    .filter(t => t.freqType === 'every' || t.freqType === 'everyday-n')
    .map(t => ({ name: t.name, freqType: t.freqType, todayDone: t.todayDone, target: t.target }));

  let dayReset = false;

  todos.forEach(task => {
    // Daily reset: every / everyday-n
    if ((task.freqType === 'every' || task.freqType === 'everyday-n') && task.lastDayKey !== dk) {
      task.history.push(histVal(task.todayDone, task.target));
      task.history = task.history.slice(-spanFor(task.freqType));
      task.todayDone = 0;
      task.lastDayKey = dk;
      changed = true;
      dayReset = true;
    }

    // Weekly reset: week tasks reset weekDone; daily tasks also reset weekDone on new week
    if (task.lastWeekKey !== wk) {
      if (task.freqType === 'week') {
        task.history.push(histVal(task.weekDone, task.target));
        task.history = task.history.slice(-spanFor(task.freqType));
      }
      task.weekDone = 0;
      task.lastWeekKey = wk;
      changed = true;
    }

    // Monthly reset: month tasks reset monthDone; others reset monthDone on new month
    if (task.lastMonthKey !== mk) {
      if (task.freqType === 'month') {
        task.history.push(histVal(task.monthDone, task.target));
        task.history = task.history.slice(-spanFor(task.freqType));
      }
      task.monthDone = 0;
      task.lastMonthKey = mk;
      changed = true;
    }
  });

  if (changed) save();

  // Show yesterday's summary on first open of a new day
  const meta = loadMeta();
  if (dayReset && meta.lastOpenedDay !== dk) {
    meta.lastOpenedDay = dk;
    saveMeta(meta);
    if (snap.length > 0) setTimeout(() => showSummaryModal(snap), 400);
  } else if (meta.lastOpenedDay !== dk) {
    meta.lastOpenedDay = dk;
    saveMeta(meta);
  }
}

// ── Summary modal ──
function showSummaryModal(snap) {
  const doneTasks = snap.filter(t => t.freqType === 'everyday-n' ? t.todayDone >= t.target : t.todayDone >= 1);
  const p = snap.length ? Math.round(doneTasks.length / snap.length * 100) : 0;

  document.getElementById('m-title').textContent = '昨日のサマリ';
  document.getElementById('m-body').textContent = '';
  const ct = document.getElementById('m-content'); ct.innerHTML = '';

  const sec = document.createElement('div'); sec.className = 'summary-section';
  const ov = document.createElement('div'); ov.className = 'summary-overall';
  ov.innerHTML = `<div class="summary-overall-pct">${p}%</div><div class="summary-overall-bar-wrap"><div class="summary-overall-label">昨日の達成率</div><div class="summary-overall-bar"><div class="summary-overall-bar-fill" style="width:${Math.min(p, 100)}%"></div></div></div>`;
  sec.appendChild(ov);

  const tl = document.createElement('div'); tl.className = 'summary-task-list';
  snap.forEach(t => {
    const done = t.freqType === 'everyday-n' ? t.todayDone >= t.target : t.todayDone >= 1;
    const label = t.freqType === 'everyday-n' ? `${t.todayDone}/${t.target}回` : (done ? '達成' : '未達成');
    const row = document.createElement('div'); row.className = 'summary-task-row';
    row.innerHTML = `<div class="summary-task-icon ${done ? 'icon-done' : 'icon-miss'}">${done ? '✓' : '✕'}</div><span class="summary-task-name">${escHtml(t.name)}</span><span class="summary-task-pct">${label}</span>`;
    tl.appendChild(row);
  });
  sec.appendChild(tl); ct.appendChild(sec);

  const bw = document.getElementById('m-btns'); bw.innerHTML = ''; bw.style.flexDirection = 'row';
  const cb = document.createElement('button'); cb.className = 'modal-btn confirm'; cb.textContent = '今日もがんばろう！';
  cb.onclick = () => { closeModal(); render(); };
  bw.appendChild(cb);
  openModalEl();
}

// ── Stats ──
function calcDailyPct() {
  const ts = todos.filter(t => t.freqType === 'every' || t.freqType === 'everyday-n');
  if (!ts.length) return 0;
  return Math.round(ts.filter(isDone).length / ts.length * 100);
}
function calcWeeklyPct() {
  const ts = todos.filter(t => t.freqType === 'week');
  if (!ts.length) return 0;
  return Math.round(ts.filter(t => t.weekDone >= t.target).length / ts.length * 100);
}
function calcMonthlyPct() {
  const ts = todos.filter(t => t.freqType === 'month');
  if (!ts.length) return 0;
  return Math.round(ts.filter(t => t.monthDone >= t.target).length / ts.length * 100);
}

// ── Meter ──
const meterAnimFrom = {};
function meterColors(lap) {
  const c = ['#8BAF7A', '#F5C84A', '#E8960A', '#C8640A'];
  const last = c.length - 1;
  return { a: c[Math.min(Math.max(0, lap - 1), last)], b: c[Math.min(lap, last)] };
}
function renderMeter(p, wrap, todoId) {
  const lap = Math.floor(p / 100), rem = p % 100, c = meterColors(lap);
  const prev = meterAnimFrom[todoId];
  const prevLap = prev !== undefined ? Math.floor(prev / 100) : lap;
  const prevRem = prev !== undefined ? prev % 100 : rem;
  meterAnimFrom[todoId] = p;
  const tr = wrap.querySelector('.meter-track'); tr.innerHTML = '';

  if (lap > 0) {
    const a = document.createElement('div'); a.className = 'm-layer-a';
    if (prev !== undefined && prevLap < lap) {
      // ラップを上抜け: layer-a を prevRem% から 100% へアニメーション
      const aFrom = prevLap === lap - 1 ? prevRem : 0;
      a.style.cssText = `width:${aFrom}%;background:${c.a};`; tr.appendChild(a);
      requestAnimationFrame(() => requestAnimationFrame(() => { a.style.width = '100%'; }));
    } else {
      a.style.cssText = `width:100%;background:${c.a};`; tr.appendChild(a);
    }
  } else if (prev !== undefined && prevLap === 1 && lap === 0) {
    // ラップを下抜け (100%→0-99%): 一時 layer-a を 100% から 0% へ縮小
    const a = document.createElement('div'); a.className = 'm-layer-a';
    a.style.cssText = `width:100%;background:${meterColors(1).a};`; tr.appendChild(a);
    requestAnimationFrame(() => requestAnimationFrame(() => { a.style.width = '0%'; }));
  }

  const fromRem = prevLap === lap ? prevRem : rem;
  const b = document.createElement('div'); b.className = 'm-layer-b';
  b.style.cssText = `width:${fromRem}%;background:${c.b};`; tr.appendChild(b);
  requestAnimationFrame(() => requestAnimationFrame(() => { b.style.width = rem + '%'; }));
}

// ── Dots ──
function renderDots(hist, grid, ft, todoId) {
  grid.innerHTML = '';
  const todo = todos.find(x => x.id === todoId);
  (hist || []).forEach((v, i) => {
    const d = document.createElement('div'); d.className = 'gdot';
    d.style.cssText = `width:${DOT_SZ}px;height:${DOT_SZ}px;background:${dotColor(v)};`;
    const ago = hist.length - i;
    d.onclick = () => openDotEdit(todoId, i, ago, ft);
    grid.appendChild(d);
  });
  // Current period dot (outlined, not editable)
  if (todo) {
    const cur = document.createElement('div'); cur.className = 'gdot';
    const curVal = histVal(getCount(todo), todo.target);
    cur.style.cssText = `width:${DOT_SZ}px;height:${DOT_SZ}px;background:${dotColor(curVal)};border:1.5px solid #A0C090;`;
    grid.appendChild(cur);
  }
}

// ── Dot edit modal ──
function openDotEdit(todoId, histIdx, ago, ft) {
  const t = todos.find(x => x.id === todoId); if (!t) return;
  function vToCount(v) { return v === 0 ? 0 : v === 1 ? Math.max(1, t.target - 1) : v === 2 ? t.target : Math.round(t.target * 1.3); }
  function countToV(c) { const p2 = t.target ? Math.round(c / t.target * 100) : 0; return p2 < 80 ? 0 : p2 < 100 ? 1 : p2 < 120 ? 2 : 3; }
  let editCount = vToCount(t.history[histIdx]);
  const agoLabel = dotDateLabel(ago, ft);

  document.getElementById('m-title').textContent = `${agoLabel}の記録を編集`;
  document.getElementById('m-body').textContent = t.name;
  const ct = document.getElementById('m-content');
  ct.innerHTML = `
    <div class="dot-edit-wrap">
      <button class="dot-edit-btn minus" id="de-minus">−</button>
      <span class="dot-edit-num" id="de-num">${editCount}</span>
      <button class="dot-edit-btn plus" id="de-plus">+</button>
    </div>
    <div class="dot-preview" id="de-preview" style="background:${dotColor(countToV(editCount))}"></div>
    <div class="dot-edit-pct" id="de-pct">${t.target ? Math.round(editCount / t.target * 100) : 0}%（目標 ${t.target}回）</div>
  `;
  function refresh() {
    document.getElementById('de-num').textContent = editCount;
    const v2 = countToV(editCount);
    document.getElementById('de-preview').style.background = dotColor(v2);
    document.getElementById('de-pct').textContent = `${t.target ? Math.round(editCount / t.target * 100) : 0}%（目標 ${t.target}回）`;
  }
  document.getElementById('de-minus').onclick = () => { if (editCount > 0) { editCount--; refresh(); } };
  document.getElementById('de-plus').onclick = () => { editCount++; refresh(); };

  const bw = document.getElementById('m-btns'); bw.innerHTML = ''; bw.style.flexDirection = 'row';
  [{ label: 'キャンセル', cls: 'cancel', action: null }, { label: '保存', cls: 'confirm', action: () => {
    const newV = countToV(editCount);
    openConfirm(
      '記録を変更しますか？',
      `${agoLabel}：${editCount}回（${t.target ? Math.round(editCount / t.target * 100) : 0}%）に変更します。`,
      [
        { label: 'キャンセル', cls: 'cancel', action: null },
        { label: '変更する', cls: 'confirm', action: () => { t.history[histIdx] = newV; save(); render(); } },
      ]
    );
  }}].forEach(b => {
    const el = document.createElement('button'); el.className = 'modal-btn ' + b.cls; el.textContent = b.label;
    el.onclick = () => { closeModal(); if (b.action) b.action(); };
    bw.appendChild(el);
  });
  openModalEl();
}

// ── Tabs / Sections ──
function buildTabs() {
  const wrap = document.getElementById('view-tabs'); wrap.innerHTML = '';
  VIEWS.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'vtab' + (v.key === curView ? ' active' : '');
    btn.textContent = v.label;
    btn.onclick = () => { curView = v.key; render(); };
    wrap.appendChild(btn);
  });
}

function buildSections() {
  const wrap = document.getElementById('sections-wrap'); wrap.innerHTML = '';
  VIEWS.forEach(v => {
    const sec = document.createElement('div');
    sec.className = 'view-section' + (v.key === curView ? ' show' : '');
    sec.id = 'sec-' + v.key;
    const filtered = todos.filter(t => v.freqTypes.includes(t.freqType));
    if (!filtered.length) {
      const msg = document.createElement('p'); msg.className = 'empty-msg';
      msg.textContent = 'タスクがありません。下から追加してください。';
      sec.appendChild(msg);
    } else {
      const list = document.createElement('div'); list.className = 'todo-list';
      filtered.forEach(t => list.appendChild(makeCard(t)));
      sec.appendChild(list);
    }
    wrap.appendChild(sec);
  });
}

function makeCard(t) {
  const count = getCount(t);
  const p = pct(count, t.target);
  const lv = lvClass(p);
  const done = isDone(t);
  const card = document.createElement('div');
  card.className = 'todo-card' + (lv ? ' ' + lv : '') + (done ? ' done-today' : '');
  card.innerHTML = `
    <div class="todo-top">
      <span class="todo-name">${escHtml(t.name)}</span>
      <span class="done-check">✓</span>
      <span class="freq-badge">${escHtml(t.freqLabel)}</span>
      <button class="menu-btn" onclick="openMenu(${t.id})">•••</button>
    </div>
    <div class="count-row">
      <div class="cnt-btns">
        <button class="cnt-btn minus" onclick="handleMinus(${t.id})">−</button>
        <span class="cnt-num">${count}</span>
        <button class="cnt-btn plus" onclick="handlePlus(${t.id})" ${undoState && undoState.todoId === t.id ? 'disabled style="opacity:.25;pointer-events:none;"' : ''}>+</button>
      </div>
      <span class="cnt-target">/ 目標 ${t.target}回</span>
      <span class="pct-pill ${pctPill(p)}">${p}%</span>
    </div>
    <div class="meter-wrap">
      <div class="meter-track"></div>
      <div class="meter-marker"></div>
    </div>
    <div class="grass-wrap">
      <div class="grass-header"><span class="grass-label">${grassLabel(t.freqType)}</span></div>
      <div class="grass-grid" id="dots-${t.id}"></div>
    </div>
  `;
  renderMeter(p, card.querySelector('.meter-wrap'), t.id);
  renderDots(t.history, card.querySelector('#dots-' + t.id), t.freqType, t.id);
  return card;
}

// ── Render ──
function render() {
  const d = new Date();
  const days = ['日', '月', '火', '水', '木', '金', '土'];
  document.getElementById('hdr-date').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${days[d.getDay()]}）`;

  const dp = calcDailyPct();
  document.getElementById('daily-pct').textContent = dp + '%';
  document.getElementById('daily-bar').style.width = Math.min(dp, 100) + '%';
  document.getElementById('daily-bar').style.background = dp > 100 ? 'var(--ov2)' : 'var(--gr)';

  const wp = calcWeeklyPct();
  document.getElementById('weekly-pct').textContent = wp + '%';
  document.getElementById('weekly-bar').style.width = Math.min(wp, 100) + '%';
  document.getElementById('weekly-bar').style.background = wp > 100 ? 'var(--ov2)' : 'var(--gr)';

  const mp = calcMonthlyPct();
  document.getElementById('monthly-pct').textContent = mp + '%';
  document.getElementById('monthly-bar').style.width = Math.min(mp, 100) + '%';
  document.getElementById('monthly-bar').style.background = mp > 100 ? 'var(--ov2)' : 'var(--gr)';

  buildTabs();
  buildSections();

  const viewFreqMap = { day: 'everyday-n', week: 'week', month: 'month' };
  addFreq = viewFreqMap[curView] || 'everyday-n';
  document.querySelectorAll('#add-fq .fq-btn').forEach(b => b.classList.toggle('sel', b.dataset.freq === addFreq));
  const nuEl = document.getElementById('add-nu');
  if (nuEl) nuEl.textContent = addFreq === 'everyday-n' ? '回/日' : addFreq === 'month' ? '回/月' : '回/週';
  document.getElementById('add-nf').className = 'n-field show';
}

// ── + / − ──
function handlePlus(id) {
  const t = todos.find(x => x.id === id); if (!t) return;
  const wasDone = isDone(t);
  doAdj(t, 1);
  if (!wasDone && isDone(t)) fireCracker();
}

function fireCracker() {
  const colors = ['#8BAF7A', '#F5C84A', '#E8960A', '#5A8A48', '#C8640A', '#D8EBC8', '#9C7E5A'];
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:300;';
  document.body.appendChild(wrap);

  ['left', 'right'].forEach((side, sideIdx) => {
    const sideDelay = sideIdx * 180;
    for (let i = 0; i < 22; i++) {
      const el = document.createElement('div');
      const size = Math.round(5 + Math.random() * 7);
      const color = colors[Math.floor(Math.random() * colors.length)];
      const startX = side === 'left' ? Math.random() * 50 : window.innerWidth - Math.random() * 50;
      const tx = side === 'left' ? 40 + Math.random() * 160 : -(40 + Math.random() * 160);
      const ty = -(140 + Math.random() * 220);
      const dur = Math.round(700 + Math.random() * 500);
      const delay = sideDelay + Math.round(Math.random() * 120);
      el.style.cssText = `position:absolute;width:${size}px;height:${size}px;left:${startX}px;bottom:10px;background:${color};border-radius:${Math.random()>.4?'50%':'2px'};`;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.transition = `transform ${dur}ms ease-out, opacity ${dur}ms ease-out`;
        el.style.transform = `translate(${tx}px,${ty}px) rotate(720deg)`;
        el.style.opacity = '0';
      }, delay);
    }
  });

  setTimeout(() => wrap.remove(), 1900);
}

function handleMinus(id) {
  const t = todos.find(x => x.id === id);
  if (!t || getCount(t) <= 0) return;

  // undoState をセットしてから doAdj → render() 時点で + が無効化される
  if (undoState) {
    clearTimeout(undoState.timerId);
    cancelAnimationFrame(undoState.rafId);
    if (undoState.todoId === id) {
      undoState.totalDelta--;
    } else {
      undoState = { todoId: id, totalDelta: -1 };
    }
  } else {
    undoState = { todoId: id, totalDelta: -1 };
  }
  undoState.startTime = Date.now();
  undoState.timerId = setTimeout(commitUndo, UNDO_MS);

  doAdj(t, -1);
  refreshUndoToast(t);
}

function commitUndo() {
  if (!undoState) return;
  cancelAnimationFrame(undoState.rafId);
  undoState = null;
  document.getElementById('undo-toast').classList.remove('show');
  render();
}

function undoTick() {
  if (!undoState) return;
  const elapsed = Date.now() - undoState.startTime;
  const remaining = Math.max(0, UNDO_MS - elapsed);
  const pct = remaining / UNDO_MS * 100;
  const bar = document.getElementById('undo-bar');
  bar.style.width = pct + '%';
  bar.style.background = pct > 62.5 ? 'var(--gr)' : pct > 37.5 ? 'var(--ov1)' : 'var(--ov2)';
  if (remaining > 0) undoState.rafId = requestAnimationFrame(undoTick);
}

function refreshUndoToast(t) {
  const count = -undoState.totalDelta;
  const btn = document.getElementById('undo-btn');
  btn.textContent = `↺  「${t.name}」を${count}回戻す`;
  btn.onclick = () => {
    clearTimeout(undoState.timerId);
    cancelAnimationFrame(undoState.rafId);
    const task = todos.find(x => x.id === undoState.todoId);
    const delta = -undoState.totalDelta;
    undoState = null;
    document.getElementById('undo-toast').classList.remove('show');
    if (task) doAdj(task, delta);
  };
  document.getElementById('undo-close').onclick = () => {
    clearTimeout(undoState.timerId);
    cancelAnimationFrame(undoState.rafId);
    undoState = null;
    document.getElementById('undo-toast').classList.remove('show');
    render();
  };
  document.getElementById('undo-toast').classList.add('show');
  cancelAnimationFrame(undoState.rafId);
  undoState.rafId = requestAnimationFrame(undoTick);
}

function doAdj(t, delta) {
  if (t.freqType === 'every' || t.freqType === 'everyday-n') {
    t.todayDone  = Math.max(0, t.todayDone  + delta);
    t.weekDone   = Math.max(0, t.weekDone   + delta);
    t.monthDone  = Math.max(0, t.monthDone  + delta);
  } else if (t.freqType === 'week') {
    t.weekDone   = Math.max(0, t.weekDone   + delta);
    t.monthDone  = Math.max(0, t.monthDone  + delta);
  } else {
    t.monthDone  = Math.max(0, t.monthDone  + delta);
  }
  save();
  render();
}

}

function exportData() {
  const json = JSON.stringify(todos, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `looply-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data) || !data.length) throw new Error();
        openConfirm(
          'データを復元しますか？',
          `${data.length}件のタスクを読み込みます。現在のデータは上書きされます。`,
          [
            { label: 'キャンセル', cls: 'cancel', action: null },
            { label: '復元する',   cls: 'confirm', action: () => { todos = data; ensureKeys(); save(); render(); } },
          ]
        );
      } catch {
        openConfirm('読み込みエラー', '有効なLooplyのバックアップファイルではありません。', [
          { label: '閉じる', cls: 'cancel', action: null },
        ]);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function openMenu(id) {
  const t = todos.find(x => x.id === id); if (!t) return;
  document.getElementById('m-title').textContent = t.name;
  document.getElementById('m-body').textContent = '';
  document.getElementById('m-content').innerHTML = '';
  const bw = document.getElementById('m-btns'); bw.innerHTML = ''; bw.style.flexDirection = 'column';
  [{ label: '✏️  編集する', cls: 'cancel', action: () => openEdit(id) },
   { label: '🗑️  削除する', cls: 'danger', action: () => confirmDelete(id) },
   { label: '閉じる', cls: 'cancel', action: null }
  ].forEach(a => {
    const el = document.createElement('button'); el.className = 'modal-btn ' + a.cls; el.textContent = a.label; el.style.textAlign = 'left';
    el.onclick = () => { closeModal(); if (a.action) a.action(); };
    bw.appendChild(el);
  });
  openModalEl();
}

function openEdit(id) {
  const t = todos.find(x => x.id === id); if (!t) return;
  document.getElementById('m-title').textContent = 'タスクを編集';
  document.getElementById('m-body').textContent = '';
  const ct = document.getElementById('m-content');
  ct.innerHTML = `
    <div class="field"><label>タスク名</label><input type="text" id="e-name" value="${escHtml(t.name)}"/></div>
    <div class="field"><label>頻度</label>
      <div class="freq-grid" id="e-fq" style="margin-bottom:0">
        <button class="fq-btn${t.freqType === 'every'      ? ' sel' : ''}" data-freq="every"      onclick="eSelFreq(this)">毎日</button>
        <button class="fq-btn${t.freqType === 'everyday-n' ? ' sel' : ''}" data-freq="everyday-n" onclick="eSelFreq(this)">毎日N回</button>
        <button class="fq-btn${t.freqType === 'week'       ? ' sel' : ''}" data-freq="week"       onclick="eSelFreq(this)">週N回</button>
        <button class="fq-btn${t.freqType === 'month'      ? ' sel' : ''}" data-freq="month"      onclick="eSelFreq(this)">月N回</button>
      </div>
      <div class="n-field${['everyday-n','week','month'].includes(t.freqType) ? ' show' : ''}" id="e-nf">
        <span>回数：</span><input class="ni" id="e-nv" type="number" min="1" max="99" value="${t.n || 2}"/>
        <span id="e-nu">${t.freqType === 'everyday-n' ? '回/日' : t.freqType === 'month' ? '回/月' : '回/週'}</span>
      </div>
    </div>`;
  const bw = document.getElementById('m-btns'); bw.innerHTML = ''; bw.style.flexDirection = 'row';
  [{ label: 'キャンセル', cls: 'cancel', action: null }, { label: '保存', cls: 'confirm', action: () => saveEdit(id) }].forEach(b => {
    const el = document.createElement('button'); el.className = 'modal-btn ' + b.cls; el.textContent = b.label;
    el.onclick = () => { closeModal(); if (b.action) b.action(); };
    bw.appendChild(el);
  });
  openModalEl();
}

function eSelFreq(btn) {
  document.querySelectorAll('#e-fq .fq-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  const f = btn.dataset.freq;
  document.getElementById('e-nf').className = 'n-field' + (['everyday-n','week','month'].includes(f) ? ' show' : '');
  const nu = document.getElementById('e-nu');
  if (nu) nu.textContent = f === 'everyday-n' ? '回/日' : f === 'month' ? '回/月' : '回/週';
}

function saveEdit(id) {
  const t = todos.find(x => x.id === id); if (!t) return;
  const name = document.getElementById('e-name').value.trim(); if (!name) return;
  const fb = document.querySelector('#e-fq .fq-btn.sel');
  const ft = fb ? fb.dataset.freq : t.freqType;
  const n = parseInt(document.getElementById('e-nv')?.value) || 2;
  t.name = name; t.freqType = ft; t.n = n;
  if (ft === 'every')           { t.target = 1; t.freqLabel = '毎日'; }
  else if (ft === 'everyday-n') { t.target = n; t.freqLabel = `毎日${n}回`; }
  else if (ft === 'week')       { t.target = n; t.freqLabel = `週${n}回`; }
  else                          { t.target = n; t.freqLabel = `月${n}回`; }
  if ((t.history || []).length !== spanFor(ft)) t.history = new Array(spanFor(ft)).fill(0);
  curView = ft === 'every' || ft === 'everyday-n' ? 'day' : ft === 'week' ? 'week' : 'month';
  save(); render();
}

function confirmDelete(id) {
  openConfirm('このタスクを削除しますか？', '削除すると記録もすべて消えます。', [
    { label: 'キャンセル', cls: 'cancel', action: null },
    { label: '削除する', cls: 'danger', action: () => { todos = todos.filter(x => x.id !== id); save(); render(); } },
  ]);
}

function openConfirm(title, body, btns) {
  document.getElementById('m-title').textContent = title;
  document.getElementById('m-body').textContent = body;
  document.getElementById('m-content').innerHTML = '';
  const bw = document.getElementById('m-btns'); bw.innerHTML = ''; bw.style.flexDirection = 'row';
  btns.forEach(b => {
    const el = document.createElement('button'); el.className = 'modal-btn ' + b.cls; el.textContent = b.label;
    el.onclick = () => { closeModal(); if (b.action) b.action(); };
    bw.appendChild(el);
  });
  openModalEl();
}

function openModalEl() { document.getElementById('modal-bg').classList.add('open'); }
function bgClose(e) { if (e.target === document.getElementById('modal-bg')) closeModal(); }
function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
  document.getElementById('m-btns').style.flexDirection = 'row';
}

// ── Add task ──
function selAddFreq(btn) {
  document.querySelectorAll('#add-fq .fq-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel'); addFreq = btn.dataset.freq;
  document.getElementById('add-nf').className = 'n-field' + (['everyday-n','week','month'].includes(addFreq) ? ' show' : '');
  const nu = document.getElementById('add-nu');
  if (nu) nu.textContent = addFreq === 'everyday-n' ? '回/日' : addFreq === 'month' ? '回/月' : '回/週';
}

function addTodo() {
  const nameEl = document.getElementById('new-name');
  const name = nameEl.value.trim(); if (!name) return;
  const n = parseInt(document.getElementById('add-nv').value) || 2;
  let target, label;
  if (addFreq === 'every')           { target = 1; label = '毎日'; }
  else if (addFreq === 'everyday-n') { target = n; label = `毎日${n}回`; }
  else if (addFreq === 'week')       { target = n; label = `週${n}回`; }
  else                               { target = n; label = `月${n}回`; }
  const dk = todayKey(), wk = weekKey(), mk = monthKey();
  todos.push({
    id: Date.now(), name, freqType: addFreq, freqLabel: label, target, n,
    todayDone: 0, weekDone: 0, monthDone: 0,
    history: new Array(spanFor(addFreq)).fill(0),
    lastDayKey: dk, lastWeekKey: wk, lastMonthKey: mk,
  });
  nameEl.value = ''; nameEl.blur();
  curView = addFreq === 'every' || addFreq === 'everyday-n' ? 'day' : addFreq === 'week' ? 'week' : 'month';
  save(); render();
}

document.getElementById('new-name').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

// ── Swipe tabs ──
let swipeX = 0, swipeY = 0;
document.addEventListener('touchstart', e => {
  swipeX = e.touches[0].clientX;
  swipeY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (document.getElementById('modal-bg').classList.contains('open')) return;
  const dx = e.changedTouches[0].clientX - swipeX;
  const dy = e.changedTouches[0].clientY - swipeY;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
  const idx = VIEWS.findIndex(v => v.key === curView);
  const next = dx < 0 ? idx + 1 : idx - 1;
  if (next >= 0 && next < VIEWS.length) { curView = VIEWS[next].key; render(); }
}, { passive: true });

function checkInstallBanner() {
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone) {
    document.getElementById('install-banner').classList.add('show');
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

load();
checkResets();
checkInstallBanner();
render();

// Check for day/week/month rollover every minute
setInterval(() => { checkResets(); render(); }, 60000);
</script>
</body>
</html>
